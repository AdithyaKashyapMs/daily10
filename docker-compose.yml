# Production stack: Postgres, API, web app and Caddy (automatic HTTPS).
#
#   cp .env.production.example .env.production      # fill it in
#   docker compose --env-file .env.production up -d --build
#   docker compose --env-file .env.production --profile telegram up -d   # + Telegram reminders
#   docker compose --env-file .env.production --profile mcp up -d        # + faculty MCP at /mcp
#
# Only Caddy is reachable from outside (ports 80/443). The API and database stay on the
# internal network; the browser reaches the API through the web app's /api proxy.

x-backend: &backend
  build: .
  restart: unless-stopped
  env_file: .env.production
  environment:
    STUDY_ENV: production
    STUDY_DATABASE_URL: postgresql+psycopg://daily10:${POSTGRES_PASSWORD}@db:5432/daily10
    STUDY_APP_URL: https://${DOMAIN}/today
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: daily10
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: daily10
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daily10 -d daily10"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8000
        NEXT_PUBLIC_TELEGRAM_BOT: ${TELEGRAM_BOT_USERNAME:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  notifier:
    <<: *backend
    profiles: ["telegram"]
    command: ["python", "-m", "daily10.notify", "serve"]

  mcp:
    <<: *backend
    profiles: ["mcp"]
    command: ["python", "-m", "daily10.mcp_server", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8765"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
